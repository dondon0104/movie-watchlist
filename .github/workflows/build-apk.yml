name: Build Ionic Android APK

on:
  push:
    branches:
      - main
      - Main

  workflow_dispatch:

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. Get the source code
      # ----------------------------------------------------------
      - name: Checkout project
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # 2. Install Node.js
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'


      # ----------------------------------------------------------
      # 3. Install project dependencies
      # ----------------------------------------------------------
      - name: Install npm dependencies
        run: npm ci


      # ----------------------------------------------------------
      # 4. Build Ionic/Vue application
      # ----------------------------------------------------------
      - name: Build Ionic application
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL || vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || vars.VITE_FIREBASE_MEASUREMENT_ID }}
        run: |
          required_vars=(VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_DATABASE_URL VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID)
          for variable_name in "${required_vars[@]}"; do
            if [ -z "${!variable_name}" ]; then
              echo "Missing required Firebase variable: ${variable_name}"
              exit 1
            fi
          done
          npm run build


      # ----------------------------------------------------------
      # 5. Install Java 21
      # IMPORTANT:
      # Capacitor Android currently compiles with Java 21.
      # ----------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'


      # ----------------------------------------------------------
      # 6. Confirm Java version
      # ----------------------------------------------------------
      - name: Check Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"


      # ----------------------------------------------------------
      # 7. Synchronize Capacitor with Android
      # ----------------------------------------------------------
      - name: Sync Capacitor Android
        run: npx cap sync android


      # ----------------------------------------------------------
      # 8. Give Gradle execution permission
      # ----------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # ----------------------------------------------------------
      # 9. Check Gradle environment
      # ----------------------------------------------------------
      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version


      # ----------------------------------------------------------
      # 10. Build debug APK
      # ----------------------------------------------------------
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug


      # ----------------------------------------------------------
      # 11. Rename the generated APK
      # ----------------------------------------------------------
      - name: movie-watchlist.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MovieWatchlist.apk


      # ----------------------------------------------------------
      # 12. Upload APK to GitHub Actions
      # ----------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: movie-watchlist-APK
          path: MovieWatchlist.apk
          if-no-files-found: error
          retention-days: 30